# Optional Blueprint — or mirror these settings in the Render dashboard.
services:
  - type: web
    name: inventory
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SEED_USER_NAME
        value: Kaushal Dagur
      - key: SEED_USER_EMAIL
        value: kaushal.dagur@inventory.com
      - key: SEED_USER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

databases:
  - name: inventory-db
    plan: free
